# foot on a 640x480 panel: ~80x24 cells at size 9, ~100x30 at size 7.
font=DejaVu Sans Mono:size=9
pad=2x2 center
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes
color=05080a 00ff88

[colors]
background=05080a
foreground=b8ffcf
regular0=0b1210
regular1=ff4d5e
regular2=00ff88
regular3=e3ff4f
regular4=22e0ff
regular5=7cffc4
regular6=00d9a3
regular7=b8ffcf
bright0=16302a
bright2=6bffb4

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
