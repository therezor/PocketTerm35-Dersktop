# foot on a 640x480 panel: ~80x24 cells at size 9, ~100x30 at size 7.
font=DejaVu Sans Mono:size=9
pad=2x2 center
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes

[colors]
background=101418
foreground=d4d8dd
regular0=101418
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=61afef
regular5=c678dd
regular6=56b6c2
regular7=d4d8dd

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
