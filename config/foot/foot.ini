# foot on a 640x480 panel: ~76x23 cells at size 10, ~80x24 at size 9.
font=DejaVu Sans Mono:size=10
pad=2x2 center
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes
color=0a1310 3ddc97

[colors]
background=0a1310
foreground=dcf3e5
regular0=121f1a
regular1=ef6b73
regular2=3ddc97
regular3=e8c468
regular4=5fd0e8
regular5=9ad9c0
regular6=5fd0e8
regular7=dcf3e5
bright0=254236
bright2=6ff0b4

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
