# pt35-desktop keyd map for the Waveshare PocketTerm35 (67-key RP2040 keyboard).
#
# Installed to /etc/keyd/pocketterm35.conf.  Reload with: sudo keyd reload
#
# RULE: keyd only ever emits STANDARD keysyms. Every shell-level action lives in
# the sway config. One owner per binding — no double remapping.
#
# !! PLACEHOLDER IDS !!  Phase 0 (`scripts/pt35-probe.sh` + `sudo evtest`) must
# fill in the real vendor:product and the real physical keys. Until then keyd
# matches any keyboard, which is safe but not device-specific.
[ids]
*

[main]
# The PocketTerm35 has no Super key. Borrow one: hold it for Mod4, tap it for
# its printed meaning. `overload` = layer while held, keysym when tapped.
# TODO(phase0): pick the real physical key (candidates: the left "sym"/"fn"
# key, or capslock if one exists) and replace `capslock` below.
capslock = overload(meta, esc)

# Fn is a layer key, not a keysym.
# TODO(phase0): confirm whether the RP2040 already resolves Fn in firmware. If
# it does, delete the [fn] layer entirely and keep only the tweaks above.
compose = layer(fn)

[meta:M]
# Nothing here: sway owns all Mod4 bindings.

[fn]
# Function row on the number row.
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12

# Navigation cluster (vi-style, and on the D-pad if it reports as arrows).
h = left
j = down
k = up
l = right
i = pageup
m = pagedown
y = home
o = end
grave = escape
backspace = delete

# Media / brightness: standard XF86 keysyms, bound in the sway config.
up    = volumeup
down  = volumedown
left  = brightnessdown
right = brightnessup
n     = mute
