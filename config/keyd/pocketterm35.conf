# pt35-desktop keyd map for the Waveshare PocketTerm35.
#
# Probed on hardware (Pi 5, 2026-09-22): the on-board RP2040 (USB 1209:0001)
# presents a *standard* HID keyboard advertising 269 keycodes, including
# leftmeta, the arrows, F1-F12, volume, brightness, mute, power, menu and
# compose, plus a separate 5-button HID mouse. Fn is resolved inside the
# firmware, and there is no gamepad device at all.
#
# So there is nothing to fix up by default: everything sway needs already
# arrives as a standard keysym. keyd is installed as the place to put per-unit
# tweaks once you know which physical key emits what (`sudo keyd monitor`).
#
# RULE: keyd only ever emits standard keysyms. Shell behaviour lives in the sway
# config: one owner per binding, nothing remapped twice.

[ids]
1209:0001

[main]

# ---------------------------------------------------------------- examples
# Uncomment only what your unit actually needs.
#
# No physical Super key? Borrow one. Hold for Mod4, tap for Escape:
#   capslock = overload(meta, esc)
#
# Fn not handled in firmware? Make a layer out of a key you can spare:
#   compose = layer(fn)
#
# [fn]
# 1 = f1
# h = left
# j = down
# k = up
# l = right
