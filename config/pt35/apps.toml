# pt35-desktop application profiles.
#
# pt35d applies a profile when the app launches and switches the output scale
# back when focus leaves its workspace. `scale` is the sway OUTPUT scale, which
# is global: 0.75 gives clients an ~853x640 logical surface, which is what makes
# GTK dialogs fit on a 640x480 panel.
#
# `exec` must be a command that is useful with no arguments. A viewer that opens
# on nothing shows a blank screen, so images and video are pointed at a folder.
#
# User override: ~/.config/pt35/apps.toml, merged per app id.

[app.terminal]
label     = "Terminal"
exec      = "foot"
match     = { app_id = "foot" }
workspace = 1
scale     = 1.0

[app.files]
label     = "Files"
exec      = "pcmanfm"
match     = { app_id = "pcmanfm", class = "Pcmanfm" }
workspace = 2
scale     = 0.75
pointer   = "auto"
buttons   = true

[app.editor]
label     = "Editor"
exec      = "mousepad"
match     = { app_id = "mousepad", class = "Mousepad" }
workspace = 3
scale     = 0.75

[app.monitor]
label     = "Monitor"
exec      = "foot -a pt35-monitor top"
match     = { app_id = "pt35-monitor" }
workspace = 4
scale     = 1.0

[app.music]
label     = "Music"
exec      = "vlc --intf qt"
match     = { app_id = "vlc", class = "vlc" }
workspace = 5
scale     = 0.75
pointer   = "auto"

[app.images]
label     = "Images"
exec      = "sh -c 'imv-wayland \"${HOME}/Pictures\"'"
match     = { app_id = "imv" }
workspace = 6
scale     = 1.0
buttons   = true

[app.video]
label      = "Video"
exec       = "mpv --player-operation-mode=pseudo-gui --idle=yes"
match      = { app_id = "mpv" }
workspace  = 7
scale      = 1.0
fullscreen = true
buttons    = true

[app.browser]
label     = "Browser"
exec      = "chromium --ozone-platform=wayland --force-device-scale-factor=0.75 --window-size=853,640"
match     = { app_id = "chromium" }
workspace = 8
scale     = 0.75
pointer   = "auto"

[app.calculator]
label     = "Calculator"
exec      = "galculator"
match     = { app_id = "galculator", class = "Galculator" }
workspace = 9
scale     = 0.75
pointer   = "auto"
