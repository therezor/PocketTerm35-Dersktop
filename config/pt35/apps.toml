# pt35-desktop application profiles.
#
# `scale` is the app's own scale, not the panel's. The output stays at native
# 640x480 so the bar and the menu never change size with the app. pt35d passes
# the value as GDK_DPI_SCALE and QT_SCALE_FACTOR: Qt and Chromium shrink their
# whole UI, GTK3 shrinks only its text.
#
# `icon` is a freedesktop icon name, drawn from the installed theme (Papirus by
# default) in the launcher, the dock and the window picker. `glyph` is what is
# drawn instead when the theme has no such icon: one or two characters.
#
# The face buttons behave the same in every app (see docs/KEYS.md), so there is
# nothing per-app to say about them.
#
# `exec` must be a command that is useful with no arguments. A viewer that opens
# on nothing shows a blank screen, so images and video are pointed at a folder.
#
# User override: ~/.config/pt35/apps.toml, merged per app id.

# The one app you want several of. Everything else focuses the copy that is
# already open rather than starting another.
[app.terminal]
label     = "Terminal"
glyph     = ">_"
icon      = "foot"
exec      = "foot pt35-hello"
match     = { app_id = "foot" }
workspace = 1
multiple  = true

# Yazi in a terminal: keyboard first, which is what this device is. Installed
# by install.sh from upstream, because Trixie does not package it.
[app.files]
label     = "Files"
glyph     = "F"
icon      = "system-file-manager"
exec      = "foot -a pt35-files yazi"
match     = { app_id = "pt35-files" }
workspace = 2

[app.editor]
label     = "Editor"
glyph     = "E"
icon      = "mousepad"
exec      = "mousepad"
match     = { app_id = "mousepad", class = "Mousepad" }
workspace = 3
scale     = 0.75

[app.monitor]
label     = "Monitor"
glyph     = "M"
icon      = "utilities-system-monitor"
exec      = "foot -a pt35-monitor htop"
match     = { app_id = "pt35-monitor" }
workspace = 4

# What is filling the disk, sorted, in a terminal. No workspace of its own:
# it opens on the first free one.
[app.disk]
label     = "Disk usage"
glyph     = "D"
icon      = "baobab"
exec      = "foot -a pt35-ncdu ncdu /home"
match     = { app_id = "pt35-ncdu" }

[app.music]
label     = "Music"
glyph     = "♪"
icon      = "vlc"
exec      = "vlc --intf qt"
match     = { app_id = "vlc", class = "vlc" }
workspace = 5
scale     = 0.75

[app.images]
label     = "Images"
glyph     = "I"
icon      = "multimedia-photo-viewer"
exec      = "sh -c 'imv-wayland \"${HOME}/Pictures\"'"
match     = { app_id = "imv" }
workspace = 6

[app.video]
label      = "Video"
glyph     = "▶"
icon      = "mpv"
exec       = "mpv --player-operation-mode=pseudo-gui --idle=yes"
match      = { app_id = "mpv" }
workspace  = 7
fullscreen = true

[app.browser]
label     = "Browser"
glyph     = "@"
icon      = "chromium"
exec      = "chromium --ozone-platform=wayland --force-device-scale-factor=0.75"
match     = { app_id = "chromium" }
workspace = 8

[app.calculator]
label     = "Calculator"
glyph     = "="
icon      = "galculator"
exec      = "galculator"
match     = { app_id = "galculator", class = "Galculator" }
workspace = 9
scale     = 0.75

# The optional local AI agent, on a model the Pi runs itself. `sudo pt35-ai
# setup` installs it and its agents; /agent switches between them.
[app.darkwire]
label     = "DarkWire"
glyph     = "DW"
icon      = "darkwire"
exec      = "foot -a darkwire darkwire chat"
match     = { app_id = "darkwire" }
