# pt35-desktop application profiles.
#
# `scale` is the app's own scale, not the panel's. The output stays at native
# 640x480 so the bar and the menu never change size with the app. pt35d passes
# the value as GDK_DPI_SCALE and QT_SCALE_FACTOR: Qt and Chromium shrink their
# whole UI, GTK3 shrinks only its text.
#
# `buttons` is true unless stated: A B X Y L R act as Enter, Escape, Tab,
# fullscreen and app switching. With the patched keyboard firmware those buttons
# are not letters, so this is safe even in a terminal. On stock firmware, set
# `buttons = false` for anything you type into.
#
# `pointer = "on_demand"` means the app is easier with a cursor, not that it
# gets one: an armed pointer holds the keyboard, so nothing else can be typed.
# Quick > Mouse, or Super+p, arms it.
#
# `exec` must be a command that is useful with no arguments. A viewer that opens
# on nothing shows a blank screen, so images and video are pointed at a folder.
#
# User override: ~/.config/pt35/apps.toml, merged per app id.

[app.terminal]
label     = "Terminal"
exec      = "foot"
match     = { app_id = "foot" }
workspace = 1

[app.files]
label     = "Files"
exec      = "pcmanfm"
match     = { app_id = "pcmanfm", class = "Pcmanfm" }
workspace = 2
scale     = 0.75
pointer   = "on_demand"

[app.editor]
label     = "Editor"
exec      = "mousepad"
match     = { app_id = "mousepad", class = "Mousepad" }
workspace = 3
scale     = 0.75

[app.monitor]
label     = "Monitor"
exec      = "foot -a pt35-monitor top"
match     = { app_id = "pt35-monitor" }
workspace = 4

[app.music]
label     = "Music"
exec      = "vlc --intf qt"
match     = { app_id = "vlc", class = "vlc" }
workspace = 5
scale     = 0.75
pointer   = "on_demand"

[app.images]
label     = "Images"
exec      = "sh -c 'imv-wayland \"${HOME}/Pictures\"'"
match     = { app_id = "imv" }
workspace = 6

[app.video]
label      = "Video"
exec       = "mpv --player-operation-mode=pseudo-gui --idle=yes"
match      = { app_id = "mpv" }
workspace  = 7
fullscreen = true

[app.browser]
label     = "Browser"
exec      = "chromium --ozone-platform=wayland --force-device-scale-factor=0.75"
match     = { app_id = "chromium" }
workspace = 8
pointer   = "on_demand"

[app.calculator]
label     = "Calculator"
exec      = "galculator"
match     = { app_id = "galculator", class = "Galculator" }
workspace = 9
scale     = 0.75
pointer   = "on_demand"
