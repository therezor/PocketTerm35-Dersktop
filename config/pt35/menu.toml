# pt35-desktop menu tree.
#
# System defaults. `~/.config/pt35/menu.toml` is merged over this, menu by menu:
# a user menu with the same id replaces it, new ids are added.
#
# Entry kinds, exactly one per entry:
#   goto    = "<menu id>"      open a submenu
#   app     = "<apps.toml id>" launch an app with its profile
#   exec    = "<command>"      run a command through sh -c
#   action  = "<pt35ctl args>" ask pt35d to do something
#   builtin = "<screen>"       a screen pt35-menu builds itself
#                              (windows | wifi | bluetooth | audio | display |
#                               desktop_entries | appearance | about)
#
# Tiles also take `icon` (a freedesktop name from the installed theme),
# `glyph` (1-2 characters, drawn when the theme has no such icon), `tint`
# (#rrggbb) and `note`.
# `layout = "grid"` draws tiles, the default draws rows.
#
# `state = "mode" | "volume" | "brightness" | "network" | "scale"`
# draws that value at the end of the row, so a toggle says which way it is set.
# `stay = true` keeps the menu open after the row runs, to watch it take effect.

# The root is the launcher: the screens that are not apps, then every app with
# a profile, then everything else with a .desktop file. X searches all of it.
root = "launcher"

# The quick panel itself is a builtin screen (switches and sliders, drawn by
# hand). This page is what sits behind its Settings chip.

[menu.settings]
title = "Settings"
entries = [
  { label = "Network",      builtin = "wifi",   state = "network", icon = "network-wireless" },
  { label = "Bluetooth",    builtin = "bluetooth", icon = "bluetooth" },
  { label = "Appearance",   builtin = "appearance", icon = "preferences-desktop-appearance" },
  { label = "System",       builtin = "system", icon = "utilities-system-monitor" },
  { label = "CPU profile",  goto = "cpu", icon = "cpu" },
  { label = "Screenshot",   action = "screenshot", icon = "camera-photo" },
  { label = "Reload shell", action = "reload", icon = "view-refresh" },
  { label = "About",        builtin = "about", icon = "help-about" },
]

[menu.cpu]
title = "CPU profile"
entries = [
  { label = "Powersave (battery)",   action = "cpu powersave", stay = true, icon = "power-profile-power-saver" },
  { label = "Balanced",              action = "cpu balanced", stay = true, icon = "power-profile-balanced" },
  { label = "Performance (27W PSU)", action = "cpu performance", stay = true, icon = "power-profile-performance" },
]

[menu.power]
title = "Power"
entries = [
  { label = "Screen off", action = "power screenoff", icon = "video-display" },
  { label = "Lock",       action = "power lock", icon = "system-lock-screen" },
  { label = "Log out",    action = "power logout", confirm = true, icon = "system-log-out" },
  { label = "Reboot",     action = "power reboot", confirm = true, icon = "system-reboot" },
  { label = "Shut down",  action = "power poweroff", confirm = true, icon = "system-shutdown" },
]
