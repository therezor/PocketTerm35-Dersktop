# pt35-desktop menu tree.
#
# System defaults. `~/.config/pt35/menu.toml` is merged over this, menu by menu:
# a user menu with the same id replaces it, new ids are added.
#
# Entry kinds, exactly one per entry:
#   goto    = "<menu id>"      open a submenu
#   app     = "<apps.toml id>" launch an app with its profile
#   exec    = "<command>"      run a command through sh -c
#   action  = "<pt35ctl args>" ask pt35d to do something
#   builtin = "<screen>"       a screen pt35-menu builds itself
#                              (windows | wifi | bluetooth | audio | display |
#                               desktop_entries | about)
#
# Tiles also take `glyph` (1-2 characters), `tint` (#rrggbb) and `note`.
# `layout = "grid"` draws tiles, the default draws rows.

root = "main"

[menu.main]
title = "Main"
layout = "grid"
entries = [
  { label = "Apps",      goto = "apps",         glyph = "A",  tint = "#3ddc97", note = "launcher" },
  { label = "Windows",   builtin = "windows",   glyph = "W",  tint = "#5fd0e8", note = "running" },
  { label = "Wi-Fi",     builtin = "wifi",      glyph = "≈", tint = "#5fd0e8", note = "networks" },
  { label = "Bluetooth", builtin = "bluetooth", glyph = "B", tint = "#9ad9c0", note = "devices" },
  { label = "Volume",    builtin = "audio",     glyph = "V",  tint = "#e8c468", note = "level" },
  { label = "Settings",  goto = "settings",     glyph = "S",  tint = "#7aa48e", note = "system" },
  { label = "Files",     app = "files",         glyph = "F",  tint = "#9ad9c0", note = "browse" },
  { label = "Terminal",  app = "terminal",      glyph = ">_", tint = "#3ddc97", note = "shell" },
  { label = "Power",     goto = "power",        glyph = "P",  tint = "#ef6b73", note = "off" },
]

[menu.apps]
title = "Apps"
layout = "grid"
entries = [
  { label = "Terminal", app = "terminal", glyph = ">_", tint = "#3ddc97" },
  { label = "Files",    app = "files",    glyph = "F",  tint = "#9ad9c0" },
  { label = "Editor",   app = "editor",   glyph = "E",  tint = "#3ddc97" },
  { label = "Monitor",  app = "monitor",  glyph = "M",  tint = "#e8c468" },
  { label = "Music",    app = "music",    glyph = "♪", tint = "#9ad9c0" },
  { label = "Images",   app = "images",   glyph = "I", tint = "#5fd0e8" },
  { label = "Video",    app = "video",    glyph = "▶",  tint = "#3ddc97" },
  { label = "Calc",     app = "calculator", glyph = "=", tint = "#e8c468" },
  { label = "Browser",  app = "browser",  glyph = "@",  tint = "#5fd0e8" },
  { label = "All apps", builtin = "desktop_entries", glyph = "…", tint = "#7aa48e" },
]

# Quick settings: the D-pad changes a value in place, no submenu, no round trip.
[menu.settings]
title = "Quick settings"
entries = [
  { label = "Volume",       adjust = "volume" },
  { label = "Brightness",   adjust = "brightness" },
  { label = "Screen scale", adjust = "scale" },
  { label = "Buttons",      action = "buttons toggle" },
  { label = "Pointer",      action = "pointer toggle" },
  { label = "Touchscreen",  action = "touch toggle" },
  { label = "CPU profile",  goto = "cpu" },
  { label = "Screenshot",   action = "screenshot" },
  { label = "Reload shell", action = "reload" },
  { label = "About",        builtin = "about" },
]

[menu.cpu]
title = "CPU profile"
entries = [
  { label = "Powersave (battery)",   action = "cpu powersave" },
  { label = "Balanced (default)",    action = "cpu balanced" },
  { label = "Performance (27W PSU)", action = "cpu performance" },
]

[menu.power]
title = "Power"
entries = [
  { label = "Screen off", action = "power screenoff" },
  { label = "Lock",       action = "power lock" },
  { label = "Log out",    action = "power logout" },
  { label = "Reboot",     action = "power reboot", confirm = true },
  { label = "Shut down",  action = "power poweroff", confirm = true },
]
