# pt35-desktop theme. Sizes are physical pixels on the 640x480 panel.
# User override: ~/.config/pt35/theme.toml, merged over this file key by key.
#
# Phosphor green on near black. The panel is 3.5" at 640x480, about 9 px/mm, so
# a 46px row is ~5mm: readable at arm's length and hittable with a thumb.

[color]
background      = "#05080a"
background_alt  = "#0b1210"
foreground      = "#b8ffcf"
muted           = "#3f7a55"
accent          = "#00ff88"
accent_fg       = "#04140b"
warning         = "#e3ff4f"
critical        = "#ff4d5e"
ok              = "#00ff88"
border          = "#16302a"

# Face-button pills in the hint bar, matching the physical buttons.
button_a        = "#00ff88"
button_b        = "#ff4d5e"
button_x        = "#22e0ff"
button_y        = "#e3ff4f"
button_neutral  = "#16302a"

[font]
family     = "DejaVu Sans"
size_bar   = 14.0
size_menu  = 21.0
size_title = 22.0
size_hint  = 13.0

[bar]
height        = 26
padding_x     = 10
show_battery  = "auto"   # auto | always | never
show_network  = true
clock_format  = "%H:%M"

[menu]
# 480 - 26 (bar) - 44 (header) - 44 (hints) = 366px of body
rows_visible  = 7
row_height    = 46
padding_x     = 14
show_numbers  = true
filter_hint   = "X to search"
header_height = 44
hint_height   = 44
radius        = 10
columns       = 3
tile_height   = 80
gap           = 8

[pointer]
speed         = 380.0    # px/s at full deflection
accel         = 2.2      # exponent applied while a direction is held
grid_levels   = 2
grid_labels   = "asdfghjkl"
