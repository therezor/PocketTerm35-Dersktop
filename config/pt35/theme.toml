# pt35-desktop theme. Sizes are physical pixels on the 640x480 panel.
# User override: ~/.config/pt35/theme.toml, merged over this file key by key.
#
# Mint on charcoal. Terminal green without the neon: a saturated #00ff88 buzzes
# on an emissive panel this small, so the accent is toned down and the text is
# off-white with a green cast. The panel is 3.5" at 640x480, about 9 px/mm, so a
# 50px row is ~5.5mm: readable at arm's length, hittable with a thumb.

[color]
background      = "#0a1310"
background_alt  = "#121f1a"
foreground      = "#dcf3e5"
muted           = "#7aa48e"
accent          = "#3ddc97"
accent_fg       = "#06130d"
warning         = "#e8c468"
critical        = "#ef6b73"
ok              = "#3ddc97"
border          = "#254236"

# Face-button pills in the hint bar, matching the physical buttons.
button_a        = "#3ddc97"
button_b        = "#ef6b73"
button_x        = "#5fd0e8"
button_y        = "#e8c468"
button_neutral  = "#254236"

[font]
family     = "DejaVu Sans"
size_bar   = 15.0
size_menu  = 23.0
size_title = 24.0
size_hint  = 14.0

[bar]
height        = 34
padding_x     = 10
show_battery  = "auto"   # auto | always | never
show_network  = true
clock_format  = "%H:%M"

[menu]
# 480 - 28 (bar) - 46 (header) - 46 (hints) = 360px of body
rows_visible  = 7
row_height    = 50
padding_x     = 14
show_numbers  = true
filter_hint   = "X to search"
header_height = 46
hint_height   = 46
radius        = 12
columns       = 3
tile_height   = 86
gap           = 10

[pointer]
speed         = 380.0    # px/s at full deflection
accel         = 2.2      # exponent applied while a direction is held
grid_levels   = 2
grid_labels   = "asdfghjkl"
