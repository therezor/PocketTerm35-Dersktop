name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # An arm64 runner: the target is a Raspberry Pi, so build and test where the
    # binaries will actually run rather than cross-compiling blind.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev pkg-config shellcheck
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Shell scripts
        run: shellcheck -S warning install.sh scripts/pt35-session scripts/pt35-hello scripts/pt35-cpu-profile scripts/pt35-ai scripts/pt35-probe.sh packaging/debian/postinst packaging/debian/prerm
      - name: Overlay checksums
        run: cd boot && sha256sum -c SHA256SUMS
