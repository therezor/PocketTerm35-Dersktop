name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev pkg-config
          cargo install cargo-deb --locked

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        run: |
          cargo deb -p pt35-desktop --no-build --output pt35-desktop_arm64.deb
          sha256sum pt35-desktop_arm64.deb > SHA256SUMS

      - name: Smoke-test the package
        run: |
          dpkg-deb --info pt35-desktop_arm64.deb
          dpkg-deb --contents pt35-desktop_arm64.deb
          # The installer only ever fetches these two names.
          test -f pt35-desktop_arm64.deb && test -f SHA256SUMS

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = index($0, "## " v " ") == 1; next} p' \
            CHANGELOG.md > notes.md
          test -s notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: notes.md
          files: |
            pt35-desktop_arm64.deb
            SHA256SUMS
            install.sh
