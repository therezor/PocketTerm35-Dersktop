[package]
name = "pt35-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Keyboard-driven desktop environment for the Waveshare PocketTerm35"

# This crate exists to package the others: `cargo deb -p pt35-desktop` collects
# every binary and configuration file into one .deb.
[lib]
path = "src/lib.rs"

[dependencies]

[package.metadata.deb]
name = "pt35-desktop"
maintainer = "therezor <roman.nagirnyi@bluloyalty.com>"
section = "x11"
priority = "optional"
extended-description = """\
A desktop environment for the Waveshare PocketTerm35 handheld: one fullscreen \
app per workspace on a 640x480 panel, driven entirely from the built-in \
keyboard and D-pad. sway does the compositing; pt35-desktop adds the status \
bar, the menu/launcher, the session daemon and a keyboard-driven mouse."""
depends = "sway, swaybg, foot, seatd, greetd, keyd, libc6, libxkbcommon0, fonts-dejavu-core, grim, wtype, psmisc, libglib2.0-bin, python3-serial"
recommends = "network-manager, bluez, swaylock, fastfetch, ncdu, bibata-cursor-theme, papirus-icon-theme, qt5-gtk-platformtheme, qt6-gtk-platformtheme, htop, pipewire, wireplumber, pipewire-pulse, xdg-desktop-portal-wlr, wl-clipboard, xwayland, i2c-tools"
# The apps in the shipped apps.toml. The launcher says so when one is missing.
suggests = "mousepad, vlc, imv, mpv, chromium, galculator"
# cargo-deb rewrites a leading "target/release/" to the real (workspace) target
# directory; everything else is relative to this package.
assets = [
    ["target/release/pt35d", "usr/bin/", "755"],
    ["target/release/pt35ctl", "usr/bin/", "755"],
    ["target/release/pt35-bar", "usr/bin/", "755"],
    ["target/release/pt35-menu", "usr/bin/", "755"],
    ["../../scripts/pt35-session", "usr/bin/", "755"],
    ["../../scripts/pt35-kbd", "usr/bin/", "755"],
    ["../../scripts/pt35-quick", "usr/bin/", "755"],
    ["../../scripts/pt35-hello", "usr/bin/", "755"],
    ["../../scripts/pt35-ai", "usr/bin/", "755"],
    ["../../config/systemd/pt35-ai.service", "usr/lib/systemd/system/", "644"],
    ["../../config/ai/darkwire-agents.yaml", "usr/share/pt35-desktop/ai/", "644"],
    ["../../config/icons/darkwire.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../config/fastfetch/config.jsonc", "etc/xdg/fastfetch/", "644"],
    ["../../config/fastfetch/skull.txt", "usr/share/pt35-desktop/fastfetch/", "644"],
    ["../../scripts/pt35-cpu-profile", "usr/lib/pt35/", "755"],
    ["../../scripts/pt35-probe.sh", "usr/share/pt35-desktop/", "755"],
    ["../../config/sway/config", "usr/share/pt35-desktop/sway/", "644"],
    ["../../config/foot/foot.ini", "usr/share/pt35-desktop/foot/", "644"],
    ["../../config/pt35/menu.toml", "usr/share/pt35-desktop/pt35/", "644"],
    ["../../config/pt35/apps.toml", "usr/share/pt35-desktop/pt35/", "644"],
    ["../../config/pt35/theme.toml", "usr/share/pt35-desktop/pt35/", "644"],
    ["../../config/keyd/pocketterm35.conf", "etc/keyd/", "644"],
    ["../../config/logind/pt35.conf", "usr/share/pt35-desktop/logind/", "644"],
    ["../../config/systemd/greetd-vt1.conf", "usr/share/pt35-desktop/systemd/", "644"],
    ["../../config/pt35-session.desktop", "usr/share/wayland-sessions/", "644"],
    ["../../packaging/pt35-cpu-profile.sudoers", "etc/sudoers.d/pt35-cpu-profile", "440"],
    ["../../packaging/70-pt35-uinput.rules", "usr/lib/udev/rules.d/", "644"],
    ["../../boot/waveshare-35dpi-5b.dtbo", "usr/share/pt35-desktop/boot/", "644"],
    ["../../README.md", "usr/share/doc/pt35-desktop/", "644"],
    ["../../LICENSE", "usr/share/doc/pt35-desktop/copyright", "644"],
    ["../../docs/KEYS.md", "usr/share/doc/pt35-desktop/", "644"],
    ["../../firmware/code.py", "usr/share/pt35-desktop/firmware/", "644"],
    ["../../firmware/stock/code.py", "usr/share/pt35-desktop/firmware/stock/", "644"],
    ["../../firmware/README.md", "usr/share/pt35-desktop/firmware/", "644"],
]
maintainer-scripts = "../../packaging/debian"
